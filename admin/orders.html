<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Caffeine Craze Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/admin-style.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
        <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="index.html">
            <img src="../Cafe-logo.png" alt="Cafe Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
            Caffeine Craze Admin
        </a>
        <button class="navbar-toggler position-absolute d-md-none collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="w-100"></div>
        <div class="navbar-nav">
            <div class="nav-item text-nowrap d-flex align-items-center">
                <span class="nav-link px-3 text-white">Welcome, <span id="adminName">Admin</span></span>
                <a class="nav-link px-3" href="../index.html" target="_blank">View Site</a>
                <a class="nav-link px-3" href="#" id="logoutBtn">Sign out</a>
            </div>
        </div>
    </header>
    
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="orders.html">
                                <i class="bi bi-cart me-2"></i>Orders
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="products.html">
                                <i class="bi bi-cup-hot me-2"></i>Products
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="users.html">
                                <i class="bi bi-people me-2"></i>Users
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
            
            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Manage Orders</h1>
                </div>
                
                <div id="alertContainer"></div>
                
                <!-- Filters -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Filter Orders</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Order Status</label>
                                <select id="filterStatus" class="form-select">
                                    <option value="">All Statuses</option>
                                    <option value="pending">Pending</option>
                                    <option value="processing">Processing</option>
                                    <option value="delivered">Delivered</option>
                                    <option value="cancelled">Cancelled</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Date From</label>
                                <input type="date" id="filterDateFrom" class="form-control">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Date To</label>
                                <input type="date" id="filterDateTo" class="form-control">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Search</label>
                                <div class="input-group">
                                    <input type="text" id="filterSearch" class="form-control" placeholder="Order ID or Customer">
                                    <button class="btn btn-primary" type="button" onclick="loadOrders()">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Orders Table -->
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0">Orders List</h5>
                            <span>Total: <span id="totalOrders">0</span> orders</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="loadingSpinner" class="spinner-container">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        
                        <div class="table-responsive" id="ordersTableContainer" style="display: none;">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Order ID</th>
                                        <th>Customer</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                        <th>Payment Method</th>
                                        <th>Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="ordersTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- View Order Modal -->
    <div class="modal fade" id="viewOrderModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Order Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="orderDetailsContent">
                    Loading...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Edit Order Modal -->
    <div class="modal fade" id="editOrderModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editOrderModalTitle">Update Order Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="orderForm">
                    <div class="modal-body">
                        <input type="hidden" id="editOrderId">
                        
                        <div class="mb-3">
                            <label class="form-label">Order Status</label>
                            <select id="editOrderStatus" class="form-select" required>
                                <option value="pending">Pending</option>
                                <option value="processing">Processing</option>
                                <option value="delivered">Delivered</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>
                            <select id="editPaymentMethod" class="form-select" required>
                                <option value="cash on delivery">Cash on Delivery</option>
                                <option value="credit card">Credit Card</option>
                                <option value="debit card">Debit Card</option>
                                <option value="upi">UPI</option>
                                <option value="wallet">Wallet</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Update Order</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import AdminService from './js/firebase-admin.js';

        // Check authentication
        const authResult = await AdminService.checkAuth();
        if (!authResult.success || !authResult.isAdmin) {
            window.location.href = 'login.html';
        }

        document.getElementById('adminName').textContent = authResult.user?.displayName || authResult.user?.email || 'Admin';

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await AdminService.logout();
            window.location.href = 'login.html';
        });

        // Make functions global
        window.loadOrders = loadOrders;
        window.viewOrder = viewOrder;
        window.editOrder = editOrder;

        let allOrders = [];

        // Load orders
        async function loadOrders() {
            try {
                const filters = {
                    status: document.getElementById('filterStatus').value,
                    dateFrom: document.getElementById('filterDateFrom').value,
                    dateTo: document.getElementById('filterDateTo').value,
                    search: document.getElementById('filterSearch').value.trim()
                };

                const result = await AdminService.getOrders(filters);
                
                if (result.success) {
                    allOrders = result.orders;
                    
                    const tbody = document.getElementById('ordersTableBody');
                    if (allOrders.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="text-center">No orders found</td></tr>';
                    } else {
                        tbody.innerHTML = allOrders.map(order => {
                            const date = new Date(order.createdAt).toLocaleString();
                            const statusBadge = getStatusBadge(order.status);
                            return `
                                <tr>
                                    <td>#${order.orderId || order.id}</td>
                                    <td>${order.customerName || 'Guest'}</td>
                                    <td>₹${parseFloat(order.totalAmount || 0).toFixed(2)}</td>
                                    <td><span class="badge ${statusBadge}">${capitalizeFirst(order.status || 'pending')}</span></td>
                                    <td>${order.paymentMethod || 'N/A'}</td>
                                    <td>${date}</td>
                                    <td>
                                        <button class="btn btn-sm btn-primary" onclick="viewOrder('${order.id}')">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                        <button class="btn btn-sm btn-warning" onclick="editOrder('${order.id}')">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </td>
                                </tr>
                            `;
                        }).join('');
                    }
                    
                    document.getElementById('totalOrders').textContent = allOrders.length;
                    document.getElementById('loadingSpinner').style.display = 'none';
                    document.getElementById('ordersTableContainer').style.display = 'block';
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                showAlert('Error loading orders', 'danger');
            }
        }

        // View order details
        async function viewOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (order) {
                const itemsHtml = order.items && order.items.length > 0 ?
                    order.items.map(item => `
                        <tr>
                            <td>${item.name}</td>
                            <td>${item.quantity}</td>
                            <td>₹${parseFloat(item.price).toFixed(2)}</td>
                            <td>₹${(item.quantity * item.price).toFixed(2)}</td>
                        </tr>
                    `).join('') :
                    '<tr><td colspan="4" class="text-center">No items</td></tr>';

                document.getElementById('orderDetailsContent').innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <h6>Order Information</h6>
                            <p><strong>Order ID:</strong> #${order.orderId || order.id}</p>
                            <p><strong>Status:</strong> <span class="badge ${getStatusBadge(order.status)}">${capitalizeFirst(order.status || 'pending')}</span></p>
                            <p><strong>Date:</strong> ${new Date(order.createdAt).toLocaleString()}</p>
                        </div>
                        <div class="col-md-6">
                            <h6>Customer Information</h6>
                            <p><strong>Name:</strong> ${order.customerName || 'N/A'}</p>
                            <p><strong>Email:</strong> ${order.customerEmail || 'N/A'}</p>
                            <p><strong>Phone:</strong> ${order.customerPhone || 'N/A'}</p>
                            <p><strong>Address:</strong> ${order.customerAddress || 'N/A'}</p>
                        </div>
                    </div>
                    <hr>
                    <h6>Order Items</h6>
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Quantity</th>
                                <th>Price</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>${itemsHtml}</tbody>
                    </table>
                    <div class="text-end">
                        <h5>Total Amount: ₹${parseFloat(order.totalAmount || 0).toFixed(2)}</h5>
                        <p><strong>Payment Method:</strong> ${order.paymentMethod || 'N/A'}</p>
                    </div>
                `;
                
                new bootstrap.Modal(document.getElementById('viewOrderModal')).show();
            }
        }

        // Edit order
        function editOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (order) {
                document.getElementById('editOrderId').value = order.id;
                document.getElementById('editOrderStatus').value = order.status || 'pending';
                document.getElementById('editPaymentMethod').value = order.paymentMethod || 'cash on delivery';
                document.getElementById('editOrderModalTitle').textContent = `Update Order #${order.orderId || order.id}`;
                
                new bootstrap.Modal(document.getElementById('editOrderModal')).show();
            }
        }

        // Handle order form submission
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const orderId = document.getElementById('editOrderId').value;
            const status = document.getElementById('editOrderStatus').value;
            const paymentMethod = document.getElementById('editPaymentMethod').value;
            
            try {
                const result = await AdminService.updateOrderStatus(orderId, status, paymentMethod);
                
                if (result.success) {
                    bootstrap.Modal.getInstance(document.getElementById('editOrderModal')).hide();
                    showAlert('Order updated successfully', 'success');
                    loadOrders();
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                console.error('Error updating order:', error);
                showAlert('Error updating order', 'danger');
            }
        });

        // Helper functions
        function getStatusBadge(status) {
            switch (status?.toLowerCase()) {
                case 'pending': return 'bg-warning';
                case 'processing': return 'bg-info';
                case 'delivered': return 'bg-success';
                case 'cancelled': return 'bg-danger';
                default: return 'bg-secondary';
            }
        }

        function capitalizeFirst(str) {
            return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        // Load orders on page load
        loadOrders();
    </script>
</body>
</html>
