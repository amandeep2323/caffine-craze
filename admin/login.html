<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Caffeine Craze</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../login.css" rel="stylesheet">
    <style>
        .admin-login-badge {
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="heading fade-in">Admin Login</h1>
        
        <div class="form-container fade-in">
            <div id="errorAlert" class="alert alert-danger" style="display: none;"></div>
            <div id="successAlert" class="alert alert-success" style="display: none;">
                Login successful! Redirecting to admin dashboard...
            </div>
            
            <div class="login-form" id="loginFormContainer">
                <div class="text-center mb-4">
                    <div class="admin-login-badge">Administrator Access Only</div>
                </div>
                
                <form class="row g-3" id="adminLoginForm">
                    <div class="col-12">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="login-button" id="loginButton">
                            <span id="loginButtonText">Login</span>
                            <span id="loginSpinner" class="spinner-border spinner-border-sm" role="status" style="display: none;"></span>
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <a href="../index.html" class="btn btn-outline-secondary">Back to Website</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import AdminService from './js/firebase-admin.js';

        const loginForm = document.getElementById('adminLoginForm');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const loginButton = document.getElementById('loginButton');
        const loginButtonText = document.getElementById('loginButtonText');
        const loginSpinner = document.getElementById('loginSpinner');

        // Show error message
        function showError(message) {
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
            successAlert.style.display = 'none';
        }

        // Show success message
        function showSuccess() {
            successAlert.style.display = 'block';
            errorAlert.style.display = 'none';
            document.getElementById('loginFormContainer').style.display = 'none';
        }

        // Check if already logged in
        AdminService.checkAuth().then(result => {
            if (result.success && result.isAdmin) {
                // Already logged in as admin, redirect
                window.location.href = 'index.html';
            }
        });

        // Handle form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Validate input
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }
            
            // Show loading state
            loginButton.disabled = true;
            loginButtonText.style.display = 'none';
            loginSpinner.style.display = 'inline-block';
            errorAlert.style.display = 'none';
            
            try {
                // Attempt login
                const result = await AdminService.login(email, password);
                
                if (result.success) {
                    showSuccess();
                    // Redirect after 1 second
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showError(result.error || 'Invalid email or password, or you don\'t have admin privileges');
                    loginButton.disabled = false;
                    loginButtonText.style.display = 'inline';
                    loginSpinner.style.display = 'none';
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Login failed. Please try again.');
                loginButton.disabled = false;
                loginButtonText.style.display = 'inline';
                loginSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
